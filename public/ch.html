      let currentCategory = 'all';
      let visibleGames = [];
      let searchRenderTimer = 0;

      const CATEGORY_ALIASES = { shooter: 'action', fighting: 'action', cards: 'strategy', io: 'multiplayer' };
      const CATEGORY_ORDER = ['action', 'adventure', 'arcade', 'sports', 'racing', 'puzzle', 'strategy', 'platformer', 'multiplayer', 'idle', 'horror', 'other'];

      function sortAlphabetically(arr) { return [...arr].sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' })); }
      function escapeHtml(v) { return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
      function normalizeCategory(v) { const n = String(v || '').trim().toLowerCase(); return CATEGORY_ALIASES[n] || n || 'other'; }
      function getGameCategories(g) { const src = Array.isArray(g?.categories) ? g.categories : Array.isArray(g?._cat) ? g._cat : []; const norm = Array.from(new Set(src.map(normalizeCategory).filter(Boolean))); return norm.length ? norm : ['other']; }
      function formatCategory(v) { return String(v || 'other').replace(/\b\w/g, l => l.toUpperCase()); }
      function isMatch(g, q) { const cats = getGameCategories(g); if (currentCategory !== 'all' && !cats.includes(currentCategory)) return false; if (!q) return true; const h = `${g?.name||''} ${g?.description||''} ${cats.join(' ')}`.toLowerCase(); return h.includes(q); }
      function getFilteredGames() { return sortAlphabetically(REAL_GAMES.filter(e => isMatch(e, currentSearchTerm))); }

      function updateTotalCount() {
        const count = visibleGames.length;
        const t = document.getElementById('totalCount');
        const s = document.getElementById('resultSummary');
        if (t) t.textContent = String(count);
        if (s) { const ctx = currentCategory === 'all' ? 'all categories' : formatCategory(currentCategory); s.textContent = `${count} games · ${ctx}`; }
        const btn = document.getElementById('surpriseButton');
        if (btn) btn.disabled = count === 0;
      }

      function renderCategoryFilters() {
        const host = document.getElementById('categoryFilters');
        if (!host) return;
        const counts = new Map();
        REAL_GAMES.forEach(g => getGameCategories(g).forEach(c => counts.set(c, (counts.get(c) || 0) + 1)));
        const extras = Array.from(counts.keys()).filter(c => !CATEGORY_ORDER.includes(c)).sort();
        const cats = ['all', ...CATEGORY_ORDER.filter(c => counts.has(c)), ...extras];
        if (currentCategory !== 'all' && !cats.includes(currentCategory)) currentCategory = 'all';
        const frag = document.createDocumentFragment();
        cats.forEach(cat => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'chip';
          btn.dataset.category = cat;
          btn.setAttribute('aria-pressed', String(cat === currentCategory));
          const cnt = cat === 'all' ? REAL_GAMES.length : counts.get(cat);
          btn.textContent = `${formatCategory(cat)} ${cnt || 0}`;
          btn.addEventListener('click', () => { currentCategory = cat; renderAll(); });
          frag.appendChild(btn);
        });
        host.replaceChildren(frag);
      }

      function renderGrid(gridId, entries) {
        const grid = document.getElementById(gridId);
        if (!grid) return 0;
        const filtered = sortAlphabetically((entries || []).filter(e => isMatch(e, currentSearchTerm)));
        visibleGames = filtered;
        const frag = document.createDocumentFragment();
        filtered.forEach((g, i) => {
          const cats = getGameCategories(g);
          const name = g.name || 'Activity';
          const card = document.createElement('button');
          card.type = 'button';
          card.className = `game-card${i < 16 ? ' is-entering' : ''}`;
          if (i < 16) card.style.animationDelay = `${i * 12}ms`;
          card.setAttribute('aria-label', `Play ${name}`);
          card.title = name;
          card.addEventListener('click', () => openGameInTab(g));
          card.innerHTML = `<span class="game-media"><img class="game-image" src="${escapeHtml(g.image || '/chemistry-games/images/game-site.svg')}" alt="${escapeHtml(name)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='/chemistry-games/images/game-site.svg'"><span class="game-index" aria-hidden="true">${String(i+1).padStart(3,'0')}</span></span><span class="game-copy"><span class="game-title">${escapeHtml(name)}</span><span class="game-meta"><span class="game-category">${escapeHtml(formatCategory(cats[0]))}</span><span class="play-label" aria-hidden="true">Play</span></span></span>`;
          frag.appendChild(card);
        });
        grid.replaceChildren(frag);
        const ld = document.getElementById('catalogLoading');
        const em = document.getElementById('emptyState');
        if (ld) ld.hidden = !gameState.loading;
        if (em) em.hidden = gameState.loading || filtered.length > 0;
        return filtered.length;
      }

      function renderSiteQuickGrid() {
        const grid = document.getElementById('siteQuickGrid');
        if (!grid) return;
        const sorted = [...ACCESS_SITES.filter(e => e.id === 'gn-math'), ...sortAlphabetically(ACCESS_SITES.filter(e => e.id !== 'gn-math'))];
        const frag = document.createDocumentFragment();
        sorted.forEach(s => {
          const t = document.createElement('button');
          t.type = 'button';
          t.className = 'site-tile';
          t.title = s.name || 'Site';
          t.setAttribute('aria-label', `Open ${s.name || 'site'}`);
          t.addEventListener('click', () => openGameInTab(s, { preferProxy: true }));
          t.innerHTML = `<img src="${escapeHtml(s.image || '/chemistry-games/images/game-site.svg')}" alt="" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='/chemistry-games/images/game-site.svg'"><span class="site-copy"><span class="site-name">${escapeHtml(s.name || 'Site')}</span><span class="site-desc">${escapeHtml(s.description || 'Game collection')}</span></span><span class="site-open" aria-hidden="true">Open</span>`;
          frag.appendChild(t);
        });
        grid.replaceChildren(frag);
      }

      function renderAll() {
        renderCategoryFilters();
        renderGrid('realActivitiesGrid', REAL_GAMES);
        renderSiteQuickGrid();
        updateTotalCount();
      }

      function normalizeText(v) { return String(v || '').trim().toLowerCase(); }
      function createActivityId(e, i) { return (normalizeText(e.name || e.url || `activity-${i}`).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || `activity-${i}`); }

      function mergeActivities(arr) {
        if (!Array.isArray(arr) || !arr.length) return 0;
        let added = 0;
        arr.forEach((e, i) => {
          const name = String(e?.name || '').trim();
          const url = String(e?.url || '').trim();
          if (!name || !url) return;
          REAL_GAMES.push({ id: createActivityId(e, i), name, description: String(e?.description || 'Activity'), url, image: String(e?.image || '/chemistry-games/images/game-site.svg'), categories: Array.isArray(e?._cat) ? e._cat.map(normalizeCategory) : ['other'] });
          added++;
        });
        return added;
      }

      async function loadActivitiesJson() {
        const r = await fetch(ACTIVITIES_JSON_URL, { cache: 'no-store' });
        if (!r.ok) throw new Error(`Failed to fetch ${ACTIVITIES_JSON_URL}: ${r.status}`);
        const d = await r.json();
        return Array.isArray(d) ? d : [];
      }

      function initSearch() {
        const input = document.getElementById('activitiesSearchInput');
        if (!input) return;
        input.addEventListener('input', e => {
          currentSearchTerm = String(e.target?.value || '').trim().toLowerCase();
          updateSearchControls();
          clearTimeout(searchRenderTimer);
          searchRenderTimer = setTimeout(renderAll, 60);
        });
        document.getElementById('clearSearchButton')?.addEventListener('click', clearSearch);
        document.getElementById('resetFiltersButton')?.addEventListener('click', () => { currentCategory = 'all'; clearSearch(); });
        document.getElementById('surpriseButton')?.addEventListener('click', () => { if (!visibleGames.length) return; openGameInTab(visibleGames[Math.floor(Math.random() * visibleGames.length)]); });
        document.addEventListener('keydown', e => {
          const tgt = e.target;
          const typing = tgt instanceof HTMLInputElement || tgt instanceof HTMLTextAreaElement || tgt?.isContentEditable;
          if (e.key === '/' && !typing) { e.preventDefault(); input.focus(); }
          if (e.key === 'Escape' && (document.activeElement === input || currentSearchTerm)) { e.preventDefault(); clearSearch(); input.focus(); }
        });
      }

      function updateSearchControls() { const c = document.getElementById('clearSearchButton'); if (c) c.classList.toggle('is-visible', Boolean(currentSearchTerm)); }
      function clearSearch() { const i = document.getElementById('activitiesSearchInput'); currentSearchTerm = ''; if (i) i.value = ''; updateSearchControls(); renderAll(); }

      let proxyInitPromise = null;
      function enforceArgonProxyDefault() { try { if (!localStorage.getItem('proxy')) localStorage.setItem('proxy', 'ag'); } catch {} }
      enforceArgonProxyDefault();

      async function waitFor(fn, ms = 6000, step = 50) { const s = Date.now(); while (Date.now() - s < ms) { try { if (fn()) return true; } catch {} await new Promise(r => setTimeout(r, step)); } return false; }

      async function initServiceWorker() {
        if (!('serviceWorker' in navigator)) return;
        try {
          const reg = await navigator.serviceWorker.getRegistration();
          if (!reg) await navigator.serviceWorker.register('/sw.js');
          await navigator.serviceWorker.ready;
          if (!navigator.serviceWorker.controller) {
            await new Promise(r => { const d = () => r(); navigator.serviceWorker.addEventListener('controllerchange', d, { once: true }); setTimeout(d, 1500); });
          }
        } catch {}
      }

      async function initBareMuxTransport() {
        const ready = await waitFor(() => typeof BareMux !== 'undefined' && typeof BareMux.BareMuxConnection === 'function', 4000);
        if (!ready) throw new Error('BareMux runtime did not load in time');
        const wispUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/wisp/';
        const connection = new BareMux.BareMuxConnection('/d5/worker.js?v=bw1');
        const transport = localStorage.getItem('transport') || 'epoxy';
        const expectedTransport = transport === 'libcurl' ? '/f1/index.mjs' : '/e9/index.mjs';
        if ((await connection.getTransport()) !== expectedTransport) await connection.setTransport(expectedTransport, [{ wisp: wispUrl }]);
        const activeTransport = await connection.getTransport();
        if (activeTransport !== expectedTransport) throw new Error(`BareMux transport verification failed. Expected ${expectedTransport}, got ${activeTransport || 'none'}.`);
        localStorage.setItem('transport', transport);
      }

      async function ensureProxyRuntimeReady() {
        if (proxyInitPromise) return proxyInitPromise;
        proxyInitPromise = (async () => { await initServiceWorker(); await initBareMuxTransport(); })().catch(err => { proxyInitPromise = null; throw err; });
        return proxyInitPromise;
      }

      function shouldForceArgonForUrl(u) {
        const r = window.NebuloProxyHostRules;
        if (r && typeof r.shouldForceArgonForUrl === 'function') return r.shouldForceArgonForUrl(u);
        try { const h = new URL(u).hostname.toLowerCase(); return h === 'play.geforcenow.com' || h.endsWith('.geforcenow.com') || h === 'login.nvidia.com' || h === 'login.nvgs.nvidia.com' || h === 'accounts.nvgs.nvidia.com'; } catch { return false; }
      }

      let sjPromise = null;
      async function ensureScramjetController() {
        if (sjPromise) return sjPromise;
        sjPromise = (async () => {
          if (typeof $scramjetLoadController !== 'function') return null;
          const { ScramjetController } = $scramjetLoadController();
          const c = new ScramjetController({ files: { wasm: '/c2/j/wasm.wasm', all: '/c2/j/all.js', sync: '/c2/j/sync.js' } });
          await c.init();
          return c;
        })().catch(() => null);
        return sjPromise;
      }

      function encodeViaUv(url) { if (typeof __uv$config !== 'undefined' && __uv$config?.encodeUrl) return __uv$config.prefix + __uv$config.encodeUrl(url); return url; }

      function shouldForceScramjetForUrl(u) {
        const r = window.NebuloProxyHostRules;
        if (r && typeof r.shouldForceScramjetForUrl === 'function') return r.shouldForceScramjetForUrl(u);
        const raw = (typeof u === 'string' ? u : String(u || '')).trim();
        if (!raw) return false;
        let p = null;
        try { p = new URL(raw); } catch { if (raw.includes('.') && !raw.includes(' ') && !raw.startsWith('/')) { try { p = new URL('https://' + raw); } catch { p = null; } } }
        if (!p) return false;
        const h = (p.hostname || '').toLowerCase();
        return h === 'crazygames.com' || h.endsWith('.crazygames.com') || h === 'play.geforcenow.com' || h.endsWith('.geforcenow.com') || h === 'tlk.io' || h.endsWith('.tlk.io');
      }

      function shouldAvoidScramjetForUrl(u) {
        const r = window.NebuloProxyHostRules;
        if (r && typeof r.shouldAvoidScramjetForUrl === 'function') return r.shouldAvoidScramjetForUrl(u);
        const raw = (typeof u === 'string' ? u : String(u || '')).trim();
        if (!raw) return false;
        let p = null;
        try { p = new URL(raw); } catch { if (raw.includes('.') && !raw.includes(' ') && !raw.startsWith('/')) { try { p = new URL('https://' + raw); } catch { p = null; } } }
        if (!p) return false;
        const h = (p.hostname || '').toLowerCase();
        return h === 'polybuzz.ai' || h.endsWith('.polybuzz.ai');
      }

      function encodeScramjetRoute(u) { const raw = (typeof u === 'string' ? u : String(u || '')).trim(); if (!raw) return raw; try { const p = new URL(raw); if (p.protocol !== 'http:' && p.protocol !== 'https:') return raw; const hash = p.hash ? p.hash.slice(1) : ''; p.hash = ''; return '/c2/j/' + encodeURIComponent(p.href) + (hash ? '#' + encodeURIComponent(hash) : ''); } catch { return '/c2/j/' + encodeURIComponent(raw); } }
      function encodeArgonRoute(u) { const p = new URL(u); return '/ag/' + p.protocol.replace(':', '') + '/' + p.host + (p.pathname || '/') + (p.search || '') + (p.hash || ''); }

      async function encodeWithSelectedProxy(absoluteUrl, overrideProxy = null) {
        const forced = shouldForceArgonForUrl(absoluteUrl) ? 'ag' : null;
        let proxy = forced || localStorage.getItem('proxy') || 'ag';
        if (proxy === 'argon') proxy = 'ag';
        if (proxy === 'ag') return encodeArgonRoute(absoluteUrl);
        if (proxy === 'sj') { const s = await ensureScramjetController(); if (s && typeof s.encodeUrl === 'function') return s.encodeUrl(absoluteUrl); if (forced === 'sj') return encodeScramjetRoute(absoluteUrl); return encodeViaUv(absoluteUrl); }
        if (proxy === 'ec') { if (typeof __eclipse$config !== 'undefined' && __eclipse$config?.codec?.encode) return __eclipse$config.prefix + __eclipse$config.codec.encode(absoluteUrl); return encodeViaUv(absoluteUrl); }
        return encodeViaUv(absoluteUrl);
      }

      function trackRecentPlay(game) {
        const token = (() => { try { return localStorage.getItem('token'); } catch { return ''; } })();
        if (!token || !game) return;
        const isLocal = typeof game.url === 'string' && game.url.startsWith('/');
        if (!isLocal) return;
        fetch('/api/game-progress/recent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
          body: JSON.stringify({ gamePath: game.url, gameName: game.name || 'Unknown', gameImage: game.image || '', gameCategories: game.categories || [] })
        }).catch(() => {});
      }

      function openInNebuloTab(url, game, forceProxy = null, proxied = true) {
        try {
          if (!window.parent || window.parent === window) return false;
          window.parent.postMessage({ type: 'open-new-tab', url, title: game?.name || 'Activity', icon: 'fa-gamepad', forceProxy: forceProxy || null, proxied: !!proxied }, '*');
          return true;
        } catch { return false; }
      }

      async function openGameInTab(game, options = {}) {
        trackRecentPlay(game);
        const isLocal = typeof game.url === 'string' && game.url.startsWith('/');
        const absoluteUrl = new URL(game.url, window.location.origin).toString();
        const proxyRequired = !isLocal && shouldForceScramjetForUrl(absoluteUrl);
        const useProxy = !isLocal && (proxyRequired || !!options.preferProxy);
        const forceProxy = shouldForceArgonForUrl(absoluteUrl) ? 'ag' : null;
        if (openInNebuloTab(isLocal ? game.url : absoluteUrl, game, forceProxy, useProxy)) return;
        if (isLocal) { window.location.href = game.url; return; }
        if (!useProxy) { window.location.href = absoluteUrl; return; }
        try { await ensureProxyRuntimeReady(); const p = await encodeWithSelectedProxy(absoluteUrl, forceProxy); window.location.href = p; } catch { window.location.href = absoluteUrl; }
      }

      function unloadChemistryActivities() {
        const g = document.getElementById('realActivitiesGrid');
        const s = document.getElementById('siteQuickGrid');
        if (g) g.innerHTML = '';
        if (s) s.innerHTML = '';
      }

      async function loadChemistryActivities() {
        if (gameState.loaded) { renderAll(); return; }
        try { const json = await loadActivitiesJson(); mergeActivities(json); } catch (err) { console.warn('Could not load activities.json, using built-in entries only.', err); }
        gameState.loaded = true;
        gameState.loading = false;
        renderAll();
      }

      async function resetProxyDatabasesInWindow() {
        if (!('indexedDB' in window)) return;
        const names = new Set(['bare-mux', 'baremux', 'bare-mux-db', 'baremux-db']);
        if (typeof indexedDB.databases === 'function') {
          try { const dbs = await indexedDB.databases(); dbs.forEach(db => { const n = db?.name || ''; const l = n.toLowerCase(); if (l.includes('bare') || l.includes('mux') || l.includes('uv') || l.includes('scram') || l.includes('idbmap')) names.add(n); }); } catch {}
        }
        await Promise.allSettled(Array.from(names).map(name => new Promise(resolve => {
          if (!name) return resolve();
          try { const req = indexedDB.deleteDatabase(name); req.onsuccess = () => resolve(); req.onerror = () => resolve(); req.onblocked = () => resolve(); } catch { resolve(); }
        })));
      }

      window.addEventListener('unhandledrejection', async (event) => {
        const msg = String(event?.reason?.message || '');
        if (!msg.includes('MessagePort') && !msg.includes('invalid MessagePort')) return;
        if (sessionStorage.getItem('proxy_port_repair_attempted') === 'true') return;
        sessionStorage.setItem('proxy_port_repair_attempted', 'true');
        try { await resetProxyDatabasesInWindow(); } catch {}
        try { localStorage.removeItem('transport'); } catch {}
        try { if (!localStorage.getItem('proxy')) localStorage.setItem('proxy', 'ag'); } catch {}
        location.reload();
      });

      // ── Recently played ──
      const recentSection = document.getElementById('recent-section');
      const recentRow = document.getElementById('recent-row');
      const timeAgo = (ts) => {
        const diff = Date.now() - ts;
        if (diff < 60000) return 'Just now';
        if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
        if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
        return Math.floor(diff / 86400000) + 'd ago';
      };
      const loadRecentlyPlayed = async () => {
        const token = (() => { try { return localStorage.getItem('token'); } catch { return ''; } })();
        if (!token) return;
        try {
          const res = await fetch('/api/game-progress', { headers: { 'x-auth-token': token } });
          if (!res.ok) return;
          const progress = await res.json();
          const recent = progress.recentlyPlayed || [];
          if (!recent.length) return;
          recentSection.hidden = false;
          recentRow.replaceChildren(...recent.slice(0, 10).map(item => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'recent-card';
            btn.setAttribute('aria-label', `Play ${item.gameName}`);
            if (item.gameImage) {
              const img = document.createElement('img');
              img.src = item.gameImage;
              img.alt = '';
              img.loading = 'lazy';
              img.addEventListener('error', () => img.remove(), { once: true });
              btn.append(img);
            }
            const copy = document.createElement('div');
            copy.className = 'recent-card-copy';
            copy.innerHTML = `<span class="recent-card-name">${escapeHtml(item.gameName)}</span><span class="recent-card-time">${timeAgo(item.playedAt)}</span>`;
            btn.append(copy);
            btn.addEventListener('click', () => {
              const game = REAL_GAMES.find(g => g.url === item.gamePath);
              if (game) openGameInTab(game);
              else openGameInTab({ name: item.gameName, url: item.gamePath, image: item.gameImage, categories: item.gameCategories || [] });
            });
            return btn;
          }));
        } catch {}
      };

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) unloadChemistryActivities();
        else loadChemistryActivities();
      });

      initSearch();
      loadChemistryActivities();
      loadRecentlyPlayed();
    })();
  </script>
