<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fan Made Activities · Nebulo</title>
  <script src="/assets/js/panic.js" defer></script>
  <script src="/assets/js/appearance.js" defer></script>
  <script src="/assets/js/cloaking.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0a0f1a;
      --bg-mid: #141a2a;
      --bg-light: #1e2535;
      --surface: rgba(21, 27, 41, 0.8);
      --surface-strong: rgba(26, 33, 50, 0.95);
      --border: rgba(101, 131, 189, 0.3);
      --text: #e7eefc;
      --muted: #9caac4;
      --accent: #4a6cf7;
      --accent-soft: #6f8cff;
      --danger: #f9707b;
      --ok: #89e7ac;
      --warn: #ffd38a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 10% -8%, rgba(74, 108, 247, 0.22), transparent 34%),
        radial-gradient(circle at 88% -12%, rgba(111, 140, 255, 0.14), transparent 30%),
        linear-gradient(150deg, var(--bg-dark) 0%, var(--bg-mid) 52%, var(--bg-light) 100%);
      color: var(--text);
      padding: 2rem 1.5rem 3rem;
      line-height: 1.45;
    }

    .page {
      max-width: 1250px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.02em;
      font-weight: 650;
      text-shadow: 0 8px 28px rgba(74, 108, 247, 0.2);
    }

    .hint {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.2rem;
      padding: 1rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.8rem;
      margin-bottom: 0.8rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.32rem;
    }

    .field > span {
      color: #cad7ef;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .input,
    .editor {
      width: 100%;
      border: 1px solid rgba(111, 140, 255, 0.35);
      border-radius: 0.8rem;
      background: rgba(11, 17, 29, 0.85);
      color: #eaf1ff;
      outline: none;
      font-size: 0.93rem;
      line-height: 1.45;
      padding: 0.7rem 0.8rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .editor {
      min-height: 210px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.84rem;
    }

    .input:focus,
    .editor:focus {
      border-color: rgba(140, 166, 255, 0.9);
      box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.18);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 0.7rem;
    }

    .btn {
      border: 1px solid rgba(129, 157, 255, 0.45);
      border-radius: 999px;
      background: rgba(31, 44, 78, 0.75);
      color: #e5eeff;
      cursor: pointer;
      padding: 0.58rem 1.15rem;
      font-size: 0.88rem;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(45, 62, 109, 0.92);
      border-color: rgba(154, 178, 255, 0.8);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      border-color: rgba(160, 181, 255, 0.95);
      color: #f4f8ff;
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      min-height: 1.2rem;
      color: #b2c1e2;
      font-size: 0.86rem;
      margin-bottom: 0.75rem;
    }

    .status[data-state="error"] { color: var(--danger); }
    .status[data-state="success"] { color: var(--ok); }
    .status[data-state="warning"] { color: var(--warn); }

    .preview {
      width: 100%;
      min-height: 340px;
      border: 1px solid rgba(111, 140, 255, 0.35);
      border-radius: 1rem;
      background: #0d1528;
    }

    .preview-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      flex-direction: column;
      background: rgba(7, 10, 18, 0.98);
      backdrop-filter: blur(3px);
    }

    .preview-overlay.active {
      display: flex;
    }

    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(111, 140, 255, 0.3);
      background: rgba(12, 18, 31, 0.92);
    }

    .preview-title {
      font-size: 0.9rem;
      color: #c8d6f1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-shell {
      flex: 1;
      min-height: 0;
      padding: 0.75rem;
      display: flex;
    }

    .preview-fullscreen-frame {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(111, 140, 255, 0.35);
      border-radius: 0.9rem;
      background: #0d1528;
    }

    .section-title {
      color: var(--muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.85rem;
      border-bottom: 1px solid rgba(101, 131, 189, 0.22);
      padding-bottom: 0.5rem;
      font-weight: 600;
    }

    .community-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 0.9rem;
    }

    .game-card {
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
      background: var(--surface);
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      text-align: left;
      color: var(--text);
    }

    .game-card:hover {
      border-color: rgba(122, 153, 255, 0.75);
      transform: translateY(-3px);
      box-shadow: 0 16px 28px rgba(32, 67, 163, 0.35);
    }

    .game-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #18223a;
      border-bottom: 1px solid rgba(111, 140, 255, 0.25);
    }

    .game-body {
      padding: 0.7rem;
    }

    .game-name {
      font-size: 0.93rem;
      font-weight: 650;
      margin-bottom: 0.22rem;
    }

    .game-desc {
      color: #a5b5d3;
      font-size: 0.8rem;
      line-height: 1.35;
      max-height: 2.8em;
      overflow: hidden;
    }

    .empty {
      color: #a5b5d3;
      font-size: 0.9rem;
      padding: 0.4rem 0;
    }

    @media (max-width: 980px) {
      .row { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 760px) {
      .row { grid-template-columns: 1fr; }
      body { padding: 1.2rem; }
      .preview { min-height: 300px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="title-row">
      <h1>Fan Made Activities</h1>
      <p class="hint">Build your own activity with HTML/CSS/JS, preview it, then submit it for approval.</p>
    </div>

    <section class="panel">
      <h2 class="section-title">Builder</h2>
      <div class="row">
        <label class="field">
          <span>Game Title</span>
          <input id="gameTitle" class="input" type="text" maxlength="80" placeholder="Flappy Bird Remix" />
        </label>
        <label class="field">
          <span>Description</span>
          <input id="gameDescription" class="input" type="text" maxlength="140" placeholder="Tap to fly through pipes." />
        </label>
        <label class="field">
          <span>Thumbnail URL (Optional)</span>
          <input id="gameThumb" class="input" type="url" maxlength="400" placeholder="https://example.com/thumb.png" />
        </label>
      </div>

      <div class="row">
        <label class="field">
          <span>HTML</span>
          <textarea id="htmlCode" class="editor" spellcheck="false" placeholder="<canvas id='game' width='400' height='600'></canvas>"></textarea>
        </label>
        <label class="field">
          <span>CSS</span>
          <textarea id="cssCode" class="editor" spellcheck="false" placeholder="body { margin: 0; }"></textarea>
        </label>
        <label class="field">
          <span>JavaScript</span>
          <textarea id="jsCode" class="editor" spellcheck="false" placeholder="console.log('game loaded');"></textarea>
        </label>
      </div>

      <div class="actions">
        <button id="loadFlappyBtn" class="btn" type="button">Load Flappy Bird Starter</button>
        <button id="previewBtn" class="btn" type="button">Preview Full Screen</button>
        <button id="clearBtn" class="btn" type="button">Clear</button>
        <button id="uploadBtn" class="btn primary" type="button">Upload to Supabase</button>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
      <iframe id="previewFrame" class="preview" title="Activity Preview"></iframe>
    </section>

    <section class="panel">
      <h2 class="section-title">Approved Community Uploads</h2>
      <div id="communityEmpty" class="empty">No fan made activities loaded yet.</div>
      <div id="communityGrid" class="community-grid"></div>
    </section>
  </div>

  <div id="previewOverlay" class="preview-overlay" aria-hidden="true">
    <div class="preview-toolbar">
      <div id="previewOverlayTitle" class="preview-title">Preview</div>
      <button id="backToEditorBtn" class="btn" type="button">Back to Editor</button>
    </div>
    <div class="preview-shell">
      <iframe id="previewFullscreenFrame" class="preview-fullscreen-frame" title="Full Screen Activity Preview"></iframe>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vrqawcngnisalnkbhira.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_SJhGZPhAL-jC0TtjERPRFw_nGPcirGZ';
    const SUPABASE_STORAGE_BUCKET = 'community-games';
    const SUPABASE_GAMES_TABLE = 'community_games';
    const APPROVAL_COLUMN = 'approved';
    const FALLBACK_IMAGE = '/chemistry-games/images/game-site.svg';

    const FLAPPY_BIRD_TEMPLATE = {
      title: 'Flappy Bird Starter',
      description: 'Simple Flappy Bird style starter with pipes and score.',
      thumb: '',
      html: `<canvas id="game" width="400" height="600"></canvas>`,
      css: `body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, #60d8ff 0%, #b7f0ff 65%, #d6f7ff 100%);
  font-family: Arial, sans-serif;
}

canvas {
  border: 3px solid #1f2d4b;
  border-radius: 12px;
  background: linear-gradient(#8fe3ff, #c8f6ff);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
}`,
      js: `const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const gravity = 0.45;
const flap = -7.2;
const pipeGap = 160;
const pipeWidth = 60;
const pipeSpeed = 2.6;

const bird = { x: 90, y: 220, w: 28, h: 22, vy: 0 };
const pipes = [];
let score = 0;
let best = Number(localStorage.getItem('flappy_best') || 0);
let frame = 0;
let gameOver = false;

function reset() {
  bird.y = 220;
  bird.vy = 0;
  pipes.length = 0;
  score = 0;
  frame = 0;
  gameOver = false;
}

function spawnPipe() {
  const minTop = 70;
  const maxTop = canvas.height - pipeGap - 70;
  const top = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
  pipes.push({ x: canvas.width + 10, top, passed: false });
}

function flapBird() {
  if (gameOver) {
    reset();
    return;
  }
  bird.vy = flap;
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    flapBird();
  }
});
window.addEventListener('mousedown', flapBird);
window.addEventListener('touchstart', (e) => {
  e.preventDefault();
  flapBird();
}, { passive: false });

function hitPipe(p) {
  const inX = bird.x + bird.w > p.x && bird.x < p.x + pipeWidth;
  const inTop = bird.y < p.top;
  const inBottom = bird.y + bird.h > p.top + pipeGap;
  return inX && (inTop || inBottom);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#68cc4a';
  ctx.fillRect(0, canvas.height - 92, canvas.width, 92);

  pipes.forEach((p) => {
    ctx.fillStyle = '#49b13e';
    ctx.fillRect(p.x, 0, pipeWidth, p.top);
    ctx.fillRect(p.x, p.top + pipeGap, pipeWidth, canvas.height - (p.top + pipeGap));

    ctx.fillStyle = '#3d9c34';
    ctx.fillRect(p.x - 4, p.top - 14, pipeWidth + 8, 14);
    ctx.fillRect(p.x - 4, p.top + pipeGap, pipeWidth + 8, 14);
  });

  ctx.fillStyle = '#ffd84c';
  ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
  ctx.fillStyle = '#1f2d4b';
  ctx.fillRect(bird.x + 18, bird.y + 6, 5, 5);

  ctx.fillStyle = '#13223f';
  ctx.font = 'bold 26px Arial';
  ctx.fillText(String(score), 14, 34);

  ctx.font = 'bold 14px Arial';
  ctx.fillText('Best: ' + best, 14, 54);

  if (gameOver) {
    ctx.fillStyle = 'rgba(10, 16, 30, 0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 32px Arial';
    ctx.fillText('Game Over', 108, 276);
    ctx.font = '16px Arial';
    ctx.fillText('Press Space / Click to restart', 90, 306);
  }
}

function update() {
  if (gameOver) return;

  frame += 1;
  if (frame % 95 === 0) spawnPipe();

  bird.vy += gravity;
  bird.y += bird.vy;

  pipes.forEach((p) => {
    p.x -= pipeSpeed;
    if (!p.passed && p.x + pipeWidth < bird.x) {
      p.passed = true;
      score += 1;
      if (score > best) {
        best = score;
        localStorage.setItem('flappy_best', String(best));
      }
    }
  });

  while (pipes.length && pipes[0].x + pipeWidth < -6) pipes.shift();

  if (bird.y < 0 || bird.y + bird.h > canvas.height - 92) gameOver = true;
  if (pipes.some(hitPipe)) gameOver = true;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

spawnPipe();
loop();`
    };

    let sbClient = null;
    let previewUrl = null;

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getEl(id) {
      return document.getElementById(id);
    }

    function setStatus(text, state = 'info') {
      const status = getEl('status');
      status.textContent = text || '';
      status.dataset.state = state;
    }

    function slugify(input) {
      const cleaned = String(input || '')
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
      return cleaned || 'fan-game';
    }

    function sanitizeScript(input) {
      return String(input || '').replace(/<\/script/gi, '<\\/script');
    }

    function ensureClient() {
      if (sbClient) return sbClient;
      if (!window.supabase || typeof window.supabase.createClient !== 'function') return null;
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      return sbClient;
    }

    function isMissingApprovalColumnError(error) {
      const msg = String(error && (error.message || error.details || error.hint) || '').toLowerCase();
      return msg.includes('approved') && (msg.includes('column') || msg.includes('schema'));
    }

    function readSource() {
      return {
        title: String(getEl('gameTitle').value || '').trim(),
        description: String(getEl('gameDescription').value || '').trim(),
        thumb: String(getEl('gameThumb').value || '').trim(),
        html: String(getEl('htmlCode').value || ''),
        css: String(getEl('cssCode').value || ''),
        js: String(getEl('jsCode').value || '')
      };
    }

    function writeSource(source) {
      getEl('gameTitle').value = source.title || '';
      getEl('gameDescription').value = source.description || '';
      getEl('gameThumb').value = source.thumb || '';
      getEl('htmlCode').value = source.html || '';
      getEl('cssCode').value = source.css || '';
      getEl('jsCode').value = source.js || '';
    }

    function buildDocument(source) {
      const title = source.title || 'Fan Made Activity';
      const html = source.html || '';
      const css = source.css || '';
      const js = sanitizeScript(source.js || '');
      const isFull = /<!doctype|<html[\s>]/i.test(html);
      if (isFull) return html;
      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${title}</title>
  <style>${css}</style>
</head>
<body>${html}<script>${js}<\/script></body>
</html>`;
    }

    function openGame(url, title) {
      const playerUrl = `/fan-game-player.html?src=${encodeURIComponent(url)}&title=${encodeURIComponent(title || 'Fan Made Activity')}`;
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'open-new-tab',
            url: playerUrl,
            title: title || 'Fan Made Activity',
            icon: 'fa-code',
            proxied: false
          }, '*');
          return;
        }
      } catch {}
      window.location.href = playerUrl;
    }

    function renderCommunityGames(items) {
      const grid = getEl('communityGrid');
      const empty = getEl('communityEmpty');
      grid.innerHTML = '';
      if (!Array.isArray(items) || !items.length) {
        empty.style.display = '';
        return;
      }

      empty.style.display = 'none';
      items.forEach((item) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'game-card';
        button.title = item.title || 'Fan Made Activity';
        button.innerHTML = `
          <img class="game-thumb" src="${escapeHtml(item.thumbnail_url || FALLBACK_IMAGE)}" alt="${escapeHtml(item.title || 'Fan Made Activity')}" loading="lazy" onerror="this.src='${FALLBACK_IMAGE}'">
          <div class="game-body">
            <div class="game-name">${escapeHtml(item.title || 'Fan Made Activity')}</div>
            <div class="game-desc">${escapeHtml(item.description || 'Community upload')}</div>
          </div>
        `;
        button.addEventListener('click', () => {
          openGame(item.game_url, item.title || 'Fan Made Activity');
        });
        grid.appendChild(button);
      });
    }

    async function loadCommunityGames() {
      const client = ensureClient();
      if (!client) {
        setStatus('Supabase client not available.', 'error');
        return;
      }

      try {
        const { data, error } = await client
          .from(SUPABASE_GAMES_TABLE)
          .select('title, description, game_url, thumbnail_url, created_at, approved')
          .eq(APPROVAL_COLUMN, true)
          .order('created_at', { ascending: false })
          .limit(60);

        if (error) throw error;
        renderCommunityGames((data || []).filter((row) => row && row.title && row.game_url));
      } catch (err) {
        renderCommunityGames([]);
        if (isMissingApprovalColumnError(err)) {
          setStatus('Set up an "approved" boolean column in community_games to enable approval workflow.', 'warning');
        } else {
          setStatus('Could not load community games. Check table/policies.', 'warning');
        }
        console.info('community_games read error:', err);
      }
    }

    function previewGame() {
      const frame = getEl('previewFrame');
      const fullscreenFrame = getEl('previewFullscreenFrame');
      const source = readSource();
      if (!source.title || !source.html.trim()) {
        setStatus('Enter at least a title and HTML before previewing.', 'warning');
        return;
      }

      const doc = buildDocument(source);
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(new Blob([doc], { type: 'text/html' }));
      frame.src = previewUrl;
      fullscreenFrame.src = previewUrl;
      openFullscreenPreview(source.title || 'Preview');
      setStatus('Preview updated.', 'success');
    }

    function openFullscreenPreview(title) {
      const overlay = getEl('previewOverlay');
      const titleEl = getEl('previewOverlayTitle');
      if (titleEl) titleEl.textContent = title ? `Preview: ${title}` : 'Preview';
      overlay.classList.add('active');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeFullscreenPreview() {
      const overlay = getEl('previewOverlay');
      overlay.classList.remove('active');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    async function uploadGame() {
      const client = ensureClient();
      const uploadBtn = getEl('uploadBtn');
      if (!client) {
        setStatus('Supabase client not available.', 'error');
        return;
      }

      const source = readSource();
      if (!source.title || !source.html.trim()) {
        setStatus('Title and HTML are required.', 'error');
        return;
      }

      const slug = slugify(source.title);
      const path = `games/${Date.now()}-${slug}.html`;
      const htmlDoc = buildDocument(source);

      uploadBtn.disabled = true;
      setStatus('Uploading...', 'info');

      try {
        const { error: uploadError } = await client.storage
          .from(SUPABASE_STORAGE_BUCKET)
          .upload(path, new Blob([htmlDoc], { type: 'text/html; charset=utf-8' }), {
            contentType: 'text/html; charset=utf-8',
            cacheControl: '3600',
            upsert: false
          });
        if (uploadError) throw uploadError;

        const { data: publicData } = client.storage.from(SUPABASE_STORAGE_BUCKET).getPublicUrl(path);
        const gameUrl = String(publicData && publicData.publicUrl || '').trim();
        if (!gameUrl) throw new Error('Storage upload worked, but no public URL was returned.');

        const { error: insertError } = await client.from(SUPABASE_GAMES_TABLE).insert({
          title: source.title,
          slug,
          description: source.description || null,
          game_url: gameUrl,
          thumbnail_url: source.thumb || null,
          approved: false
        });

        if (insertError) {
          if (isMissingApprovalColumnError(insertError)) {
            setStatus('Uploaded file, but approval is not configured. Add approved:boolean column first.', 'warning');
          } else {
            setStatus('Uploaded file, but failed to insert into community_games table.', 'warning');
          }
          console.info('community_games insert error:', insertError);
        } else {
          setStatus('Submitted for approval. It will appear after you approve it.', 'success');
        }

        await loadCommunityGames();
      } catch (err) {
        setStatus(`Upload failed: ${err && err.message ? err.message : 'Unknown error'}`, 'error');
      } finally {
        uploadBtn.disabled = false;
      }
    }

    function clearEditors() {
      writeSource({ title: '', description: '', thumb: '', html: '', css: '', js: '' });
      const frame = getEl('previewFrame');
      const fullscreenFrame = getEl('previewFullscreenFrame');
      frame.removeAttribute('src');
      fullscreenFrame.removeAttribute('src');
      closeFullscreenPreview();
      setStatus('Editors cleared.', 'success');
    }

    function boot() {
      getEl('loadFlappyBtn').addEventListener('click', () => {
        writeSource(FLAPPY_BIRD_TEMPLATE);
        setStatus('Flappy Bird starter loaded. Edit it however you want.', 'success');
      });
      getEl('previewBtn').addEventListener('click', previewGame);
      getEl('clearBtn').addEventListener('click', clearEditors);
      getEl('uploadBtn').addEventListener('click', uploadGame);
      getEl('backToEditorBtn').addEventListener('click', closeFullscreenPreview);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeFullscreenPreview();
      });
      loadCommunityGames();
    }

    boot();
  </script>
</body>
</html>
