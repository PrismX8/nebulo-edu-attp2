<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08090a">
  <title>Shorts | Nebulo</title>
  <script src="/assets/js/identity-mask.js" defer></script>
  <link rel="stylesheet" href="/assets/css/youtube-shorts.css?v=20260818-2">
</head>
<body>
  <a class="skip-link" href="#shorts-feed">Skip to videos</a>

  <header class="shorts-chrome" aria-label="Shorts navigation">
    <button class="chrome-button" id="back-button" type="button" aria-label="Back to YouTube" title="Back to YouTube">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m14.5 5-7 7 7 7"></path>
      </svg>
    </button>
    <span class="chrome-label">Shorts</span>
  </header>

  <main class="shorts-feed" id="shorts-feed" aria-label="YouTube Shorts" tabindex="-1"></main>
  <p class="sr-only" id="feed-announcer" aria-live="polite"></p>

  <template id="short-template">
    <article class="short-panel" aria-roledescription="short video">
      <section class="short-stage" aria-label="Video player">
        <video class="short-video" playsinline muted preload="none"></video>
        <img class="short-poster" alt="" draggable="false">

        <button class="media-toggle" type="button" aria-label="Play video">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13l10-6.5z"></path>
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5h4v14H7zm6 0h4v14h-4z"></path>
          </svg>
        </button>

        <div class="short-loading" role="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span class="loading-copy">Preparing video</span>
        </div>

        <div class="short-error" role="alert" hidden>
          <strong>Video unavailable</strong>
          <span class="error-copy">The stream could not be loaded.</span>
          <button class="retry-button" type="button">Retry</button>
        </div>

        <div class="short-position" aria-hidden="true"></div>

        <button class="mute-button" type="button" aria-label="Unmute video" title="Unmute (M)">
          <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9zm12.5.5 4 4m0-4-4 4"></path>
          </svg>
          <svg class="icon-volume" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9zm12-1.5a6 6 0 0 1 0 9m2.5-11.5a9 9 0 0 1 0 14"></path>
          </svg>
        </button>

        <div class="short-overlay">
          <div class="short-copy">
            <p class="short-author">YouTube</p>
            <h1 class="short-title">Loading video...</h1>
          </div>
          <div class="progress-row">
            <span class="current-time">0:00</span>
            <input class="short-progress" type="range" min="0" max="100" value="0" step="0.05" aria-label="Video position">
            <span class="duration">0:00</span>
          </div>
        </div>
      </section>
    </article>
  </template>

  <script src="/vendor/dash.all.min.js"></script>
  <script src="/assets/js/youtube-shorts.js?v=20260818-2"></script>
</body>
</html>
