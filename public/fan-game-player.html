<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fan Game Player · Nebulo</title>
  <style>
    :root {
      --bg-dark: #09101d;
      --bg-mid: #101a2f;
      --text: #e7eefc;
      --muted: #9caac4;
      --border: rgba(101, 131, 189, 0.28);
      --accent: #4a6cf7;
      --surface: rgba(21, 27, 41, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      height: 100vh;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% -8%, rgba(74, 108, 247, 0.22), transparent 34%),
        radial-gradient(circle at 88% -12%, rgba(111, 140, 255, 0.14), transparent 30%),
        linear-gradient(150deg, var(--bg-dark) 0%, var(--bg-mid) 100%);
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
      position: fixed;
      z-index: 20;
      top: 0.8rem;
      left: 0.8rem;
      background: transparent;
    }

    .actions {
      display: flex;
      gap: 0;
      flex-wrap: nowrap;
      justify-content: flex-start;
    }

    .btn {
      border: 1px solid rgba(129, 157, 255, 0.44);
      border-radius: 999px;
      background: rgba(12, 18, 31, 0.82);
      color: #e5eeff;
      cursor: pointer;
      padding: 0.48rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    .stage {
      flex: 1 1 auto;
      min-height: 100vh;
      height: 100vh;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      background: #0d1528;
    }

    #gameFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0d1528;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="actions">
      <button id="backBtn" class="btn" type="button">Back</button>
    </div>
  </div>
  <div class="stage">
    <iframe id="gameFrame" title="Fan Game Player"></iframe>
  </div>

  <script>
    function getParam(key) {
      const params = new URLSearchParams(window.location.search);
      return params.get(key) || '';
    }

    function escapeAttr(input) {
      return String(input || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function toBaseHref(inputUrl) {
      try {
        const u = new URL(inputUrl);
        const pathname = u.pathname || '/';
        const basePath = pathname.endsWith('/') ? pathname : pathname.slice(0, pathname.lastIndexOf('/') + 1);
        return `${u.origin}${basePath}`;
      } catch {
        return '';
      }
    }

    function injectBaseTag(rawHtml, sourceUrl) {
      const baseHref = toBaseHref(sourceUrl);
      if (!baseHref) return rawHtml;
      if (/<base[\s>]/i.test(rawHtml)) return rawHtml;
      const baseTag = `<base href="${escapeAttr(baseHref)}">`;

      if (/<head[\s>]/i.test(rawHtml)) {
        return rawHtml.replace(/<head[^>]*>/i, (match) => `${match}\n${baseTag}`);
      }
      if (/<!doctype|<html[\s>]/i.test(rawHtml)) {
        if (/<html[\s>][\s\S]*<\/html>/i.test(rawHtml)) {
          return rawHtml.replace(/<html[^>]*>/i, (match) => `${match}\n<head>${baseTag}</head>`);
        }
        return rawHtml;
      }

      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  ${baseTag}
</head>
<body>
${rawHtml}
</body>
</html>`;
    }

    async function loadGame() {
      const src = String(getParam('src') || '').trim();
      const frame = document.getElementById('gameFrame');
      const backBtn = document.getElementById('backBtn');

      backBtn.addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = '/fan-made-activities.html';
        }
      });

      if (!src) {
        return;
      }

      try {
        const response = await fetch(src, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const html = await response.text();
        const finalHtml = injectBaseTag(html, src);
        frame.srcdoc = finalHtml;
      } catch (err) {
        frame.src = src;
      }
    }

    loadGame();
  </script>
</body>
</html>
