<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>YouTube Player | Nebulo</title>
  <link rel="stylesheet" href="/assets/css/youtube-player.css?v=20260808-3">
</head>
<body>
  <header class="player-header">
    <button class="header-button" id="back-button" type="button" aria-label="Go back" title="Go back">&#8592;</button>
    <a class="wordmark" href="/tools">Nebulo</a>
    <form class="video-address" id="video-address" autocomplete="off">
      <label class="sr-only" for="video-url">YouTube URL</label>
      <input id="video-url" type="text" inputmode="url" placeholder="Paste a YouTube link" spellcheck="false">
      <button type="submit">Open</button>
    </form>
  </header>

  <main class="watch-layout">
    <section class="player-shell" id="player-shell" aria-label="Video player">
      <video id="video" playsinline preload="metadata"></video>
      <div class="poster" id="poster"></div>
      <button class="center-play" id="center-play" type="button" aria-label="Play video">&#9654;</button>
      <div class="loading" id="loading" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span id="loading-text">Preparing video</span>
      </div>
      <div class="player-error" id="player-error" role="alert" hidden>
        <strong>Playback could not start</strong>
        <span id="error-message">Reload the stream and try again.</span>
        <button id="retry-button" type="button">Retry</button>
      </div>

      <div class="controls" id="controls">
        <input class="timeline" id="timeline" type="range" min="0" max="100" value="0" step="0.05" aria-label="Video position">
        <div class="control-row">
          <button class="control-button" id="play-button" type="button" aria-label="Play" title="Play or pause (K)">&#9654;</button>
          <button class="control-button" id="mute-button" type="button" aria-label="Mute" title="Mute (M)">&#128266;</button>
          <input class="volume" id="volume" type="range" min="0" max="1" value="1" step="0.05" aria-label="Volume">
          <span class="time" id="time">0:00 / 0:00</span>
          <span class="control-spacer"></span>
          <label class="quality-label" for="quality">Quality</label>
          <select id="quality" aria-label="Video quality">
            <option value="auto">Auto</option>
          </select>
          <button class="control-button" id="fullscreen-button" type="button" aria-label="Full screen" title="Full screen (F)">&#9974;</button>
        </div>
      </div>
    </section>

    <section class="video-details" aria-live="polite">
      <div class="detail-main">
        <h1 id="video-title">Loading video...</h1>
        <div class="detail-line">
          <span id="video-author">YouTube</span>
          <span class="detail-dot" aria-hidden="true"></span>
          <span id="video-views"></span>
        </div>
      </div>
      <div class="video-actions">
        <div class="like-stat" aria-label="YouTube likes">
          <span aria-hidden="true">&#128077;</span>
          <span id="video-likes">--</span>
        </div>
        <div class="engine-state" id="engine-state">Adaptive playback</div>
      </div>
    </section>

    <section class="comments-section" aria-labelledby="comments-heading">
      <div class="comments-heading-row">
        <h2 id="comments-heading">Comments</h2>
        <span id="comments-count"></span>
      </div>
      <div class="comments-loading" id="comments-loading" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading comments</span>
      </div>
      <p class="comments-message" id="comments-message" hidden></p>
      <ol class="comments-list" id="comments-list"></ol>
      <div class="comments-more" id="comments-more" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading more comments</span>
      </div>
    </section>
  </main>

  <script src="/vendor/dash.all.min.js"></script>
  <script src="/assets/js/youtube-player.js?v=20260811-instant-seek-1"></script>
</body>
</html>
