<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="color-scheme" content="light dark">
  <title>google.com</title>
  <style>
    :root {
      --page: #fff;
      --heading: #202124;
      --text: #5f6368;
      --link: #1a73e8;
      --button-text: #fff;
      --button: #1a73e8;
      --icon: #5f6368;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: var(--page); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
    button { font: inherit; }
    .first-visit {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #000;
      color: #fff;
      text-align: center;
    }
    .first-visit-inner { width: min(700px, 100%); }
    .first-visit h1 { display: inline-block; margin: 0 0 24px; padding-bottom: 8px; border-bottom: 1px solid #333; font-size: clamp(48px, 12vw, 80px); font-weight: 300; letter-spacing: -2px; text-transform: lowercase; }
    .first-visit p { margin: 0 0 38px; color: #ccc; font-size: clamp(20px, 4vw, 29px); font-weight: 300; line-height: 1.5; }
    .first-visit strong { padding: 2px 7px; border-radius: 4px; background: #222; color: #fff; font-weight: 600; }
    .continue-button { min-width: 230px; min-height: 60px; padding: 12px 28px; border: 2px solid #fff; border-radius: 40px; background: transparent; color: #fff; cursor: pointer; font-size: 22px; }
    .continue-button:disabled { border-color: #666; color: #666; cursor: not-allowed; }
    .continue-button:not(:disabled):hover, .continue-button:not(:disabled):focus-visible { background: #fff; color: #000; outline: none; }
    .press-n-prompt { width: 72px; margin: 0 0 16px; color: #c5221f; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 800; letter-spacing: .08em; text-align: center; white-space: nowrap; animation: blink 1s steps(2, end) infinite; }
    .error-shell { width: min(600px, calc(100% - 48px)); margin: 0 auto; padding-top: max(130px, 18vh); }
    .error-icon { position: relative; width: 72px; height: 72px; margin-bottom: 38px; color: var(--icon); }
    .error-icon::before, .error-icon::after { content: ""; position: absolute; background: currentColor; }
    .error-icon::before { width: 72px; height: 4px; top: 34px; left: 0; transform: rotate(45deg); }
    .error-icon::after { width: 4px; height: 72px; top: 0; left: 34px; transform: rotate(45deg); }
    h1 { margin: 0 0 16px; color: var(--heading); font-size: 28px; font-weight: 400; line-height: 1.25; }
    .error-shell p { margin: 0 0 14px; font-size: 15px; line-height: 1.6; }
    .error-shell ul { margin: 0; padding-left: 28px; font-size: 15px; line-height: 1.6; }
    .error-shell a { color: var(--link); text-decoration: none; }
    .error-code { margin-top: 14px; font-size: 12px; text-transform: uppercase; }
    .reload-button { min-width: 90px; min-height: 40px; margin-top: 48px; padding: 8px 18px; border: 0; border-radius: 20px; background: var(--button); color: var(--button-text); cursor: pointer; font-size: 14px; font-weight: 600; }
    .reload-button:focus-visible { outline: 3px solid rgba(26, 115, 232, .35); outline-offset: 2px; }
    @keyframes blink { 50% { opacity: .2; } }
    @media (prefers-color-scheme: dark) {
      :root { --page: #202124; --heading: #bdc1c6; --text: #9aa0a6; --link: #8ab4f8; --button: #8ab4f8; --button-text: #202124; --icon: #9aa0a6; }
      .press-n-prompt { color: #ff6b63; }
    }
    @media (max-width: 520px) { .error-shell { width: calc(100% - 48px); padding-top: 110px; } h1 { font-size: 24px; } }
    @media (prefers-reduced-motion: reduce) { .press-n-prompt { animation: none; } }
  </style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="ac558ad5-a729-416f-846e-d59a418f77ac"></script>
</head>
<body>
  <main id="page"></main>
  <script>
    (() => {
      const STORAGE_KEY = 'nebuloFirstVisit';
      const SETUP_URL = '/setup-v2';
      const LOCAL_WORKER_URL = '/sw.js?v=20260831-tiktok-fast-feed-cache-29';
      const page = document.getElementById('page');
      let visited = false;
      try { visited = localStorage.getItem(STORAGE_KEY) === 'true'; } catch (_) {}

      // Root is the first page seen in a fresh session. Ask the browser to
      // replace any older proxy worker before it opens the local setup iframe.
      // This is intentionally non-blocking so the N-key/new-window flow keeps
      // its user gesture and popup permission.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(LOCAL_WORKER_URL, { updateViaCache: 'none' }).catch(() => {});
      }

      const openSetup = () => {
        try { localStorage.setItem(STORAGE_KEY, 'true'); } catch (_) {}
        const popup = window.open('about:blank', '_blank');
        if (!popup) {
          window.location.assign(SETUP_URL);
          return;
        }
        popup.document.write('<!doctype html><html><head><title>Setup</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#050706}</style></head><body><iframe title="Nebulo setup" src="' + window.location.origin + SETUP_URL + '"></iframe></body></html>');
        popup.document.close();
        window.location.assign('https://google.com');
      };

      document.addEventListener('keydown', (event) => {
        if (event.key && event.key.toLowerCase() === 'n') openSetup();
      });

      if (!visited) {
        page.className = 'first-visit';
        page.innerHTML = '<div class="first-visit-inner"><h1>Nebulo</h1><p>Next time you load this page there will be a fake error page.<br>Press <strong>N</strong> to get to the website.</p><button class="continue-button" id="continue" type="button" disabled>Continue <span id="countdown">10s</span></button></div>';
        const button = document.getElementById('continue');
        const countdown = document.getElementById('countdown');
        let seconds = 10;
        const timer = setInterval(() => {
          seconds -= 1;
          countdown.textContent = seconds + 's';
          if (seconds <= 0) {
            clearInterval(timer);
            button.disabled = false;
          }
        }, 1000);
        button.addEventListener('click', openSetup);
        return;
      }

      page.innerHTML = '<section class="error-shell" aria-labelledby="error-heading"><div class="press-n-prompt">PRESS N</div><div class="error-icon" aria-hidden="true"></div><h1 id="error-heading">This site can\'t be reached</h1><p>Check if there is a typo in <strong>google.com</strong>.</p><ul><li>If spelling is correct, <a href="#diagnostics">try running Windows Network Diagnostics</a>.</li></ul><div class="error-code">DNS_PROBE_FINISHED_NXDOMAIN</div><button class="reload-button" type="button">Reload</button></section>';
      page.querySelector('.reload-button').addEventListener('click', () => window.location.reload());
    })();
  </script>
</body>
</html>
