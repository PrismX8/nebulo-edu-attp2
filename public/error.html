<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    window.nebuloMobileEntry = matchMedia('(max-width: 820px)').matches
      || navigator.userAgentData?.mobile === true
      || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.maxTouchPoints > 1 && matchMedia('(pointer: coarse)').matches);
    if (window.nebuloMobileEntry) {
      try { localStorage.setItem('nebuloFirstVisit', 'true'); } catch (_) {}
      window.location.replace('/setup-v2');
    }
  </script>
  <meta name="monetag" content="ebb7362c5a55e3234b2edb2a48916819">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="color-scheme" content="light dark">
  <title>google.com</title>
  <script src="/assets/js/identity-mask.js" defer></script>
  <style>
    :root {
      --page: #fff;
      --heading: #202124;
      --text: #5f6368;
      --link: #1a73e8;
      --button-text: #fff;
      --button: #1a73e8;
      --icon: #5f6368;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body { background: var(--page); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; }

    /* ── First-visit screen ── */
    .first-visit {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #000;
      color: #fff;
      text-align: center;
    }
    .first-visit-inner {
      width: min(520px, 100%);
      animation: fadeUp .6s cubic-bezier(.2,.8,.2,1) both;
    }
    .first-visit-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .first-visit-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3f8cff;
      box-shadow: 0 0 20px rgba(63, 140, 255, .6);
    }
    .first-visit-label {
      font: 800 10px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(255,255,255,.45);
    }
    .first-visit h1 {
      font-size: clamp(42px, 10vw, 64px);
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1;
      margin-bottom: 16px;
    }
    .first-visit-divider {
      width: 48px;
      height: 2px;
      margin: 0 auto 20px;
      background: rgba(255,255,255,.12);
      border-radius: 1px;
    }
    .first-visit p {
      margin: 0 0 36px;
      color: rgba(255,255,255,.5);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.6;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }
    .first-visit p strong {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.75);
      font-weight: 700;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .continue-button {
      min-width: 200px;
      min-height: 52px;
      padding: 12px 28px;
      border: 1.5px solid rgba(255,255,255,.2);
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .01em;
      transition: all .2s ease;
    }
    .continue-button:disabled {
      border-color: rgba(255,255,255,.06);
      color: rgba(255,255,255,.2);
      cursor: not-allowed;
      background: transparent;
    }
    .continue-button:not(:disabled):hover {
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.35);
      transform: translateY(-1px);
    }
    .continue-button:not(:disabled):active {
      transform: translateY(0);
    }
    .continue-button:not(:disabled):focus-visible {
      outline: 2px solid rgba(63, 140, 255, .8);
      outline-offset: 3px;
    }
    .countdown-badge {
      display: inline-block;
      min-width: 32px;
      margin-left: 8px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255,255,255,.08);
      font: 700 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      vertical-align: middle;
    }

    /* ── Error page ── */
    .error-shell {
      width: min(560px, calc(100% - 48px));
      margin: 0 auto;
      padding-top: max(120px, 18vh);
      animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) both;
    }
    .error-icon {
      position: relative;
      width: 56px;
      height: 56px;
      margin-bottom: 32px;
      color: var(--icon);
    }
    .error-icon::before, .error-icon::after {
      content: "";
      position: absolute;
      background: currentColor;
    }
    .error-icon::before {
      width: 56px;
      height: 3px;
      top: 26px;
      left: 0;
      transform: rotate(45deg);
      border-radius: 2px;
    }
    .error-icon::after {
      width: 3px;
      height: 56px;
      top: 0;
      left: 26px;
      transform: rotate(45deg);
      border-radius: 2px;
    }
    .press-n-prompt {
      display: inline-block;
      width: auto;
      min-width: 80px;
      margin: 0 0 20px;
      padding: 4px 12px;
      border-radius: 6px;
      background: rgba(210, 48, 48, .08);
      color: #d93025;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .1em;
      text-align: center;
      white-space: nowrap;
      animation: blink 1.2s steps(2, end) infinite;
    }
    .error-shell h1 {
      margin: 0 0 12px;
      color: var(--heading);
      font-size: 26px;
      font-weight: 400;
      line-height: 1.3;
    }
    .error-shell p {
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.6;
    }
    .error-shell ul {
      margin: 0;
      padding-left: 24px;
      font-size: 14px;
      line-height: 1.6;
    }
    .error-shell a {
      color: var(--link);
      text-decoration: none;
    }
    .error-shell a:hover {
      text-decoration: underline;
    }
    .error-code {
      margin-top: 24px;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(0,0,0,.04);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .reload-button {
      min-width: 90px;
      min-height: 40px;
      margin-top: 36px;
      padding: 8px 18px;
      border: 0;
      border-radius: 8px;
      background: var(--button);
      color: var(--button-text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: background .15s ease, transform .1s ease;
    }
    .reload-button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .reload-button:active {
      transform: translateY(0);
    }
    .reload-button:focus-visible {
      outline: 3px solid rgba(26, 115, 232, .35);
      outline-offset: 2px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink { 50% { opacity: .2; } }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #202124;
        --heading: #e8eaed;
        --text: #9aa0a6;
        --link: #8ab4f8;
        --button: #8ab4f8;
        --button-text: #202124;
        --icon: #9aa0a6;
      }
      .error-code { background: rgba(255,255,255,.04); }
      .press-n-prompt { color: #f28b82; background: rgba(242, 139, 130, .1); }
    }

    @media (max-width: 820px) {
      html, body { min-height: 100vh; min-height: 100dvh; }
      .first-visit {
        min-height: 100vh;
        min-height: 100dvh;
        place-items: end center;
        padding: max(24px, env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
      }
      .first-visit-inner { max-width: 380px; }
      .first-visit h1 { font-size: clamp(38px, 14vw, 56px); margin-bottom: 12px; }
      .first-visit p { font-size: 14px; margin-bottom: 28px; }
      .continue-button {
        width: 100%;
        min-height: 50px;
        border-radius: 10px;
        font-size: 15px;
      }
      .error-shell {
        width: min(100% - 36px, 500px);
        padding-top: max(64px, calc(env(safe-area-inset-top) + 44px));
        padding-bottom: calc(28px + env(safe-area-inset-bottom));
      }
      .error-icon { width: 48px; height: 48px; margin-bottom: 24px; }
      .error-icon::before { width: 48px; top: 22px; }
      .error-icon::after { height: 48px; left: 22px; }
      .error-shell h1 { font-size: 22px; }
      .error-shell p, .error-shell ul { font-size: 13px; }
      .reload-button { min-width: 100px; min-height: 42px; margin-top: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .first-visit-inner, .error-shell { animation: none; }
      .press-n-prompt { animation: none; }
    }
  </style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="ac558ad5-a729-416f-846e-d59a418f77ac"></script>
</head>
<body>
  <main id="page"></main>
  <script>
    (() => {
      if (window.nebuloMobileEntry) return;
      const STORAGE_KEY = 'nebuloFirstVisit';
      const SETUP_URL = '/setup-v2';
      const LOCAL_WORKER_URL = '/sw.js?v=20260906-local-chat-route-fix-31';
      const page = document.getElementById('page');
      let visited = false;
      try { visited = localStorage.getItem(STORAGE_KEY) === 'true'; } catch (_) {}

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(LOCAL_WORKER_URL, { updateViaCache: 'none' }).catch(() => {});
      }

      const openSetup = () => {
        try { localStorage.setItem(STORAGE_KEY, 'true'); } catch (_) {}
        window.location.assign(SETUP_URL);
      };

      document.addEventListener('keydown', (event) => {
        if (event.key && event.key.toLowerCase() === 'n') openSetup();
      });

      if (!visited) {
        page.className = 'first-visit';
        page.innerHTML = '<div class="first-visit-inner">'
          + '<div class="first-visit-brand"><span class="first-visit-dot" aria-hidden="true"></span><span class="first-visit-label">Nebulo</span></div>'
          + '<h1>Welcome</h1>'
          + '<div class="first-visit-divider" aria-hidden="true"></div>'
          + '<p>Press <strong>N</strong> next time you visit to enter the site. Or continue now.</p>'
          + '<button class="continue-button" id="continue" type="button" disabled>Continue <span class="countdown-badge" id="countdown">10</span></button>'
          + '</div>';
        const button = document.getElementById('continue');
        const countdown = document.getElementById('countdown');
        let seconds = 10;
        const timer = setInterval(() => {
          seconds -= 1;
          countdown.textContent = seconds;
          if (seconds <= 0) {
            clearInterval(timer);
            button.disabled = false;
          }
        }, 1000);
        button.addEventListener('click', openSetup);
        return;
      }

      page.className = 'error-shell';
      page.setAttribute('aria-labelledby', 'error-heading');
      page.innerHTML = '<div class="press-n-prompt" aria-hidden="true">PRESS N</div>'
        + '<div class="error-icon" aria-hidden="true"></div>'
        + '<h1 id="error-heading">This site can\'t be reached</h1>'
        + '<p>Check if there is a typo in <strong>google.com</strong>.</p>'
        + '<ul><li>If spelling is correct, try running Windows Network Diagnostics.</li></ul>'
        + '<div class="error-code">DNS_PROBE_FINISHED_NXDOMAIN</div>'
        + '<button class="reload-button" type="button">Reload</button>';
      page.querySelector('.reload-button').addEventListener('click', () => window.location.reload());
    })();
  </script>
</body>
</html>
